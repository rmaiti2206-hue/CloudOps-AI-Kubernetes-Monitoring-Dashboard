apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudops-frontend, namespace: cloudops-ai}
spec:
  replicas: 2
  selector: {matchLabels: {app: cloudops-frontend}}
  template:
    metadata: {labels: {app: cloudops-frontend}}
    spec:
      containers:
      - name: frontend
        image: cloudops-frontend:latest
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: cloudops-frontend, namespace: cloudops-ai}
spec:
  type: NodePort
  selector: {app: cloudops-frontend}
  ports: [{port: 80,targetPort: 80}]
