services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudops_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/cloudops_ai
      PROMETHEUS_URL: http://prometheus:9090
      DEMO_MODE: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on: [postgres,prometheus]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  pgdata:
